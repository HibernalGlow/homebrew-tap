<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="612" viewBox="0 0 1160 612" role="img" aria-label="签名分流：两个判定门 codesign strict verify 与 spctl 公证，分出必须重签名、清 quarantine、装完即用三类处置">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1160" height="612" rx="16" fill="#0b1220"/>
  <rect x="0.75" y="0.75" width="1158.5" height="610.5" rx="16" fill="none" stroke="#1e2b45" stroke-width="1.5"/>

  <text x="40" y="42" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="19" font-weight="700" fill="#e2e8f0">签名分流 &#183; 两个判定门，三类处置</text>
  <text x="40" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="14" fill="#7c8ca5">Two gates, three dispositions &#8212; every cask here is filed by these two commands, never by upstream prose.</text>

  <!-- ===================== gate spine ===================== -->
  <g>
    <rect x="40" y="112" width="268" height="76" rx="12" fill="#131f36" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="174" y="140" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#bae6fd">Gate 1 &#183; 封套自洽吗</text>
    <text x="174" y="162" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#94a3b8">codesign --verify \</text>
    <text x="174" y="178" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#94a3b8">--deep --strict &lt;app&gt;</text>
  </g>
  <path d="M174 188 V242" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="184" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#4ade80">exit 0</text>
  <g>
    <rect x="40" y="246" width="268" height="76" rx="12" fill="#131f36" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="174" y="274" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#ddd6fe">Gate 2 &#183; 苹果公证了吗</text>
    <text x="174" y="296" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#94a3b8">spctl -a -vvv &lt;app&gt;</text>
    <text x="174" y="312" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94a3b8">&#8594; source=Notarized Developer ID</text>
  </g>

  <!-- ===================== disposition A ===================== -->
  <path d="M308 150 H356" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="332" y="136" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#f59e0b">exit &#8800; 0</text>
  <g>
    <rect x="360" y="96" width="760" height="108" rx="12" fill="#1b1408" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="380" y="114" width="26" height="26" rx="7" fill="#f59e0b"/>
    <text x="393" y="133" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#1b1408">A</text>
    <text x="418" y="132" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="700" fill="#fcd34d">启动前必须重签名 &#183; re-sign before first launch</text>
    <text x="418" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e2e8f0">codesign --force --deep --sign - &lt;app&gt;</text>
    <text x="418" y="178" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" fill="#a8b3c4">两种成因、同一条修复：声明有密封资源却没有 _CodeSignature；封套在但资源名 NFC / NFD 不一致。</text>
    <text x="418" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b9ab1">micyou &#183; splayer-next &#183; lume-app &#183; nigate &#183; folia &#183; maaend</text>
  </g>

  <!-- ===================== disposition B ===================== -->
  <path d="M308 284 H332 V262 H356" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="330" y="252" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" fill="#a78bfa">没有这行</text>
  <g>
    <rect x="360" y="226" width="760" height="108" rx="12" fill="#1a1329" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="380" y="244" width="26" height="26" rx="7" fill="#a78bfa"/>
    <text x="393" y="263" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#1a1329">B</text>
    <text x="418" y="262" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="700" fill="#c4b5fd">首启要清 quarantine &#183; clear quarantine on first launch</text>
    <text x="418" y="286" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" fill="#a8b3c4">ad-hoc 或自签证书、未公证，但签名自洽 &#8212; 包没有损坏，所以不进自动修复列表。</text>
    <text x="418" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b9ab1">reinplayer &#183; jhentai &#183; jhentaix &#183; arcthumb &#183; rawviewer</text>
    <text x="418" y="324" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b9ab1">my-window-pip &#183; status-trio &#183; clamless &#183; hibernal</text>
  </g>

  <!-- ===================== disposition C ===================== -->
  <path d="M308 300 H332 V394 H356" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="330" y="384" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" fill="#34d399">出现这行</text>
  <g>
    <rect x="360" y="356" width="760" height="86" rx="12" fill="#0c1a13" stroke="#34d399" stroke-width="1.5"/>
    <rect x="380" y="374" width="26" height="26" rx="7" fill="#34d399"/>
    <text x="393" y="393" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#0c1a13">C</text>
    <text x="418" y="392" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="700" fill="#6ee7b7">装完即用 &#183; installs clean, no fix caveats</text>
    <text x="418" y="414" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" fill="#a8b3c4">Developer ID + 公证票，部分还带 hardened runtime。</text>
    <text x="418" y="432" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b9ab1">netcatty &#183; ztools &#183; clipp &#183; pelmet &#183; mectrics &#183; opennow &#183; ferail</text>
  </g>

  <!-- ===================== footnote strip ===================== -->
  <g>
    <rect x="40" y="464" width="1080" height="112" rx="12" fill="#111a2b" stroke="#1e2b45" stroke-width="1.5"/>
    <text x="60" y="492" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" font-weight="700" fill="#f87171">先记住：本机 spctl -a 的 accepted 不是证据</text>
    <text x="60" y="516" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" fill="#a8b3c4">这台机器 spctl --status 是 assessments disabled，任何包都回 accepted。顺序只能是 codesign -dvvv 读 Authority / TeamIdentifier，</text>
    <text x="60" y="536" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" fill="#a8b3c4">再看 spctl -a -vvv 有没有 source=Notarized Developer ID。Gate 1 的退出码也是本机 LaunchAgent 自动修复脚本的唯一判据。</text>
    <text x="60" y="560" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" fill="#6b7a90">menu-bar-dock 尚未逐项复核签名，暂不入列；4 个 font- cask 不带 app bundle，不参与这套分流。</text>
  </g>
</svg>
